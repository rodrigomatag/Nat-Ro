<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naty mi amor💘</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6f2;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: inline-block;
        }
        h1 {
            color: #ff4d6d;
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }
        #noBtn {
            background-color: #ddd;
            color: black;
            position: absolute;
        }
        #message {
            display: none;
            font-size: 18px;
            margin-top: 20px;
            color: #333;
        }
        #imageContainer {
            display: none;
            margin-top: 20px;
        }
        #loveImage {
            width: 200px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Would you be my Valentine? 💖</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="showMessage()">Yes</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
        <p id="message">Gracias por permitirme ser parte de tu vida y hacerme tan feliz desde que estamos juntos. Quiero que este 14 de febrero sea muy especial e inolvidable. ❤️</p>
        <div id="imageContainer">
            <img id="loveImage" src="amordecine.jpg" alt="Love Image">
        </div>
    </div>

    <script>
        function moveButton() {
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 50);
            document.getElementById('noBtn').style.left = `${x}px`;
            document.getElementById('noBtn').style.top = `${y}px`;
        }

        function showMessage() {
            document.getElementById('message').style.display = 'block';
            document.getElementById('imageContainer').style.display = 'block';
        }
    </script>
</body>
</html>
