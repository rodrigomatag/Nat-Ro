<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🌸 6 meses Juntos  🌸</title>
  <style>
    body {
      background: #ffe6f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #b30059;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      color: #cc0066;
    }

    .countdown {
      font-size: 3em;
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .time-box {
      background-color: #ffd9ec;
      border-radius: 20px;
      padding: 20px;
      min-width: 100px;
      box-shadow: 0 0 10px #ff99cc;
    }

    .label {
      font-size: 0.6em;
      margin-top: 5px;
      color: #660033;
    }

    footer {
      margin-top: 50px;
      font-size: 1em;
      color: #993366;
    }
  </style>
</head>
<body>

  <h1>⏳ ¡Faltan para vernos! 💖</h1>
  <div class="countdown">
    <div class="time-box">
      <div id="days">00</div>
      <div class="label">días</div>
    </div>
    <div class="time-box">
      <div id="hours">00</div>
      <div class="label">horas</div>
    </div>
    <div class="time-box">
      <div id="minutes">00</div>
      <div class="label">minutos</div>
    </div>
    <div class="time-box">
      <div id="seconds">00</div>
      <div class="label">segundos</div>
    </div>
  </div>

  <footer>
    💌 Cada segundo más cerca de ti 🌷
  </footer>

  <script>
    const countdownDate = new Date("August 15, 2025 11:00:00").getTime();

    const x = setInterval(() => {
      const now = new Date().getTime();
      const distance = countdownDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerHTML = days.toString().padStart(2, '0');
      document.getElementById("hours").innerHTML = hours.toString().padStart(2, '0');
      document.getElementById("minutes").innerHTML = minutes.toString().padStart(2, '0');
      document.getElementById("seconds").innerHTML = seconds.toString().padStart(2, '0');

      if (distance < 0) {
        clearInterval(x);
        document.querySelector(".countdown").innerHTML = "🎉 ¡Es el gran día, mi amor! 💘";
      }
    }, 1000);
  </script>

</body>
</html>
